name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # GitHub Secrets로 서버 .env 갱신
            # Required secrets:
            #   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
            #   KOPIS_API_KEY, MUSICBRAINZ_USER_AGENT
            #   SETLISTFM_API_KEY
            #   SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET
            #   INTERNAL_SECRET
            mkdir -p /opt/coming-data
            cat > /opt/coming-data/.env <<EOF
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            KOPIS_API_KEY=${{ secrets.KOPIS_API_KEY }}
            MUSICBRAINZ_USER_AGENT=${{ secrets.MUSICBRAINZ_USER_AGENT }}
            SETLISTFM_API_KEY=${{ secrets.SETLISTFM_API_KEY }}
            SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
            SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
            INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
            EOF

            # 이미지 pull 및 컨테이너 재시작
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop coming-data || true
            docker rm coming-data || true
            docker run -d \
              --name coming-data \
              --restart unless-stopped \
              --env-file /opt/coming-data/.env \
              ghcr.io/${{ github.repository }}:latest
