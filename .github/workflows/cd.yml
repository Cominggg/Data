name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/cominggg/coming-data:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Update data.env and deploy
        uses: appleboy/ssh-action@v1
        env:
          V_DB_HOST: ${{ secrets.DB_HOST }}
          V_DB_PORT: ${{ secrets.DB_PORT }}
          V_DB_NAME: ${{ secrets.DB_NAME }}
          V_DB_USER: ${{ secrets.DB_USER }}
          V_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          V_KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
          V_MUSICBRAINZ_USER_AGENT: ${{ secrets.MUSICBRAINZ_USER_AGENT }}
          V_SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
          V_SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          V_SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          V_INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          V_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          V_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V_GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: V_DB_HOST,V_DB_PORT,V_DB_NAME,V_DB_USER,V_DB_PASSWORD,V_KOPIS_API_KEY,V_MUSICBRAINZ_USER_AGENT,V_SETLISTFM_API_KEY,V_SPOTIFY_CLIENT_ID,V_SPOTIFY_CLIENT_SECRET,V_INTERNAL_SECRET,V_DISCORD_WEBHOOK_URL,V_GITHUB_TOKEN,V_GITHUB_ACTOR
          script: |
            set -e
            mkdir -p ~/compose
            printf 'DB_HOST=%s\n'               "$V_DB_HOST"               >  ~/compose/data.env
            printf 'DB_PORT=%s\n'               "$V_DB_PORT"               >> ~/compose/data.env
            printf 'DB_NAME=%s\n'               "$V_DB_NAME"               >> ~/compose/data.env
            printf 'DB_USER=%s\n'               "$V_DB_USER"               >> ~/compose/data.env
            printf 'DB_PASSWORD=%s\n'           "$V_DB_PASSWORD"           >> ~/compose/data.env
            printf 'KOPIS_API_KEY=%s\n'         "$V_KOPIS_API_KEY"         >> ~/compose/data.env
            printf 'MUSICBRAINZ_USER_AGENT=%s\n' "$V_MUSICBRAINZ_USER_AGENT" >> ~/compose/data.env
            printf 'SETLISTFM_API_KEY=%s\n'     "$V_SETLISTFM_API_KEY"     >> ~/compose/data.env
            printf 'SPOTIFY_CLIENT_ID=%s\n'     "$V_SPOTIFY_CLIENT_ID"     >> ~/compose/data.env
            printf 'SPOTIFY_CLIENT_SECRET=%s\n' "$V_SPOTIFY_CLIENT_SECRET" >> ~/compose/data.env
            printf 'INTERNAL_SECRET=%s\n'       "$V_INTERNAL_SECRET"       >> ~/compose/data.env
            printf 'DISCORD_WEBHOOK_URL=%s\n'   "$V_DISCORD_WEBHOOK_URL"   >> ~/compose/data.env

            echo "$V_GITHUB_TOKEN" | docker login ghcr.io -u "$V_GITHUB_ACTOR" --password-stdin
            docker compose -f ~/compose/docker-compose.yml pull data
            docker compose -f ~/compose/docker-compose.yml up -d data
