[project]
name = "jpop-data-collector"
version = "0.1.0"
description = "JPOP 아티스트 및 내한공연 수집 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
