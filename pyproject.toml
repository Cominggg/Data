[project]
name = "coming-data"
version = "0.1.0"
description = "Jpop 아티스트 및 내한공연 수집 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "apscheduler>=3.10",
    "rapidfuzz>=3.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=collectors --cov=db --cov=matchers --cov-report=term-missing"

[tool.coverage.run]
source = ["collectors", "db", "matchers"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
